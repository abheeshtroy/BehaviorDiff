name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install .[dev]

      - name: Verify CLI
        run: behaviordiff --help

      - name: Run Python tests
        run: python -m pytest -q

      - name: Build distribution artifacts
        run: python -m pip install build twine && python -m build --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test wheel install
        run: |
          python -m venv "$RUNNER_TEMP/behaviordiff-wheel-smoke"
          "$RUNNER_TEMP/behaviordiff-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/behaviordiff-wheel-smoke/bin/behaviordiff" --help

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        run: npm run build
