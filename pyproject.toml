[project]
name = "behaviordiff"
version = "0.1.0"
description = "Compare the behavior of two versions of an application."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "docker>=7",
    "structlog>=24",
    "psycopg[binary]>=3",
    "httpx>=0.27",
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/abheeshtroy/BehaviorDiff"
Repository = "https://github.com/abheeshtroy/BehaviorDiff"
Issues = "https://github.com/abheeshtroy/BehaviorDiff/issues"

[project.scripts]
behaviordiff = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["ai*", "engine*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
