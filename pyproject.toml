[project]
name = "behaviordiff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "docker>=7",
    "structlog>=24",
    "psycopg[binary]>=3",
    "httpx>=0.27",
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
