# Benchmark regression 12: checkout never authorizes the payment.
#
# An outbound-surface test, and the first of the set to route the app through
# the proxy: env_var points the app's own PAYMENT_URL at it, so every call it
# would have made to the provider is recorded instead.
#
# orders is observed rather than payment_calls: both versions write the same
# order, so the call the target never made is the only difference, which is
# the one this benchmark is scoring.
app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - orders

outbound:
  services:
    - name: payment-provider
      base_url: https://api.payments.example.com
      env_var: PAYMENT_URL      # the variable the app already reads
      mock_responses:
        POST /v1/authorize:
          status: 200
          body:
            status: approved
            auth_id: mock_001

compare:
  base_ref: main
  target_ref: bug/skip-payment-auth
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: checkout-a-valid-cart
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 1}]}
        capture: {"cart_id": "$.cart_id"}
      - method: POST
        path: /api/checkout
        body: {"cart_id": "{cart_id}", "address": {"street": "123 Main", "city": "SF", "zip": "94102"}}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
  ignore_row_order:
    - orders
