# Benchmark regression 07: the authorization is never recorded in payment_calls.
#
# A Postgres-surface test. The HTTP responses are identical on both sides —
# the missing row in payment_calls is the only trace of the change.
app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - payment_calls

compare:
  base_ref: main
  target_ref: bug/skip-payment-record
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: checkout-a-valid-cart
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 1}]}
        capture: {"cart_id": "$.cart_id"}
      - method: POST
        path: /api/checkout
        body: {"cart_id": "{cart_id}", "address": {"street": "123 Main", "city": "SF", "zip": "94102"}}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
  ignore_row_order:
    - payment_calls
