# Benchmark regression 05: a new cart is priced at 0 whatever it holds.
#
# An HTTP-surface test. Creating a cart writes to carts, so the database is
# configured — but the observed table (jobs) is one no step in this workflow
# writes, which keeps the compared surface to HTTP alone.
app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - jobs      # untouched by this workflow: HTTP is the surface under test

compare:
  base_ref: main
  target_ref: bug/hardcode-cart-total
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: create-a-cart-with-items
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 2}, {"sku": "SOCK-01", "qty": 3}]}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
