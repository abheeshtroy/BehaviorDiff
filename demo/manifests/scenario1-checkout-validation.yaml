app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - carts
    - orders
    - payment_calls

outbound:
  services:
    - name: payment-provider
      base_url: http://payment-provider:9090
      mock_responses:
        POST /v1/authorize:
          status: 200
          body: {"auth_id": "mock_001", "status": "approved"}

compare:
  base_ref: main
  target_ref: fix/checkout-validation
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: checkout-with-discount-and-invalid-address
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 1}]}
        capture: {"cart_id": "$.cart_id"}
      - method: POST
        path: /api/carts/{cart_id}/discount
        body: {"code": "SAVE10"}
      - method: POST
        path: /api/checkout
        body: {"cart_id": "{cart_id}", "address": {"city": "SF"}}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
  ignore_row_order:
    - carts
    - orders
