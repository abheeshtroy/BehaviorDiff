# Benchmark control 17: the imports are reordered and nothing else changes.
#
# Expected finding count: zero. A diff that touches the top of a module is
# still a diff, and this is the case that says so without saying anything else.
app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - orders

compare:
  base_ref: main
  target_ref: noop/reorder-imports
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: create-order-then-read-it-back
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 1}]}
        capture: {"cart_id": "$.cart_id"}
      - method: POST
        path: /api/checkout
        body: {"cart_id": "{cart_id}", "address": {"street": "123 Main", "city": "SF", "zip": "94102"}}
        capture: {"order_id": "$.order_id"}
      - method: GET
        path: /api/orders/{order_id}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
  ignore_row_order:
    - orders
