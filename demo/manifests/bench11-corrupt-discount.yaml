# Benchmark regression 11: applying a code records the code but not the price.
#
# A Postgres-surface test, and the one of the set that also shows on HTTP: the
# discount response returns the cart's stored total, which is now the total the
# discount never came off.
app:
  name: shop-api
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  healthcheck: /health
  dockerfile: Dockerfile

database:
  type: postgres
  seed: seed.sql
  observe_tables:
    - carts

compare:
  base_ref: main
  target_ref: bug/corrupt-discount-total
  repo: ../.demo-repo  # relative to this manifest; built by demo/build_demo_repo.py

workflows:
  - name: create-a-cart-and-discount-it
    steps:
      - method: POST
        path: /api/carts
        body: {"items": [{"sku": "SHOE-42", "qty": 1}]}
        capture: {"cart_id": "$.cart_id"}
      - method: POST
        path: /api/carts/{cart_id}/discount
        body: {"code": "SAVE10"}

normalize:
  ignore_fields:
    - "*.created_at"
    - "*.updated_at"
    - "headers.date"      # response clock, not behaviour
  uuid_fields:
    - "*.cart_id"
    - "*.order_id"
    - "*.id"
  numeric_tolerance: 0.001
  ignore_row_order:
    - carts
